name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk SavingsApp-v${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SavingsApp-v${{ github.run_number }}
          path: SavingsApp-v${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: 存钱记录 v${{ github.run_number }}
          body: 用手机下载下面的 APK 安装即可。更新时直接覆盖安装，数据会保留。
          files: SavingsApp-v${{ github.run_number }}.apk
          make_latest: true
