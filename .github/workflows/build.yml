name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build release APK
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon 2>&1 | tee build.log

      - name: Show compile errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong" -A3 build.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk SavingsApp-v${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SavingsApp-v${{ github.run_number }}
          path: SavingsApp-v${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: 存钱记录 v${{ github.run_number }}
          body: 用手机下载下面的 APK 安装即可。更新时直接覆盖安装，数据会保留。
          files: SavingsApp-v${{ github.run_number }}.apk
          make_latest: true
